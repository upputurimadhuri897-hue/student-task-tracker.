
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task & Deadline Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div>
            <h1>Student Task Tracker</h1>
            <p>Organize your studies. Never miss a deadline.</p>
        </div>
    </header>

    <main class="container">
        <section class="summary">
            <div class="summary-card">
                <span>Total Tasks</span>
                <h2 id="totalTasks">0</h2>
            </div>
            <div class="summary-card">
                <span>Pending Tasks</span>
                <h2 id="pendingTasks">0</h2>
            </div>
            <div class="summary-card">
                <span>Completed Tasks</span>
                <h2 id="completedTasks">0</h2>
            </div>
        </section>

        <section class="panel">
            <h2>Add a New Task</h2>

            <form id="taskForm">
                <label for="taskTitle">Task Title</label>
                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Example: Complete AI assignment"
                    required
                >

                <label for="taskSubject">Subject</label>
                <input
                    type="text"
                    id="taskSubject"
                    placeholder="Example: Machine Learning"
                    required
                >

                <label for="taskDeadline">Deadline</label>
                <input type="date" id="taskDeadline" required>

                <label for="taskPriority">Priority</label>
                <select id="taskPriority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <button type="submit" class="primary-btn">Add Task</button>
            </form>
        </section>

        <section class="panel">
            <div class="task-heading">
                <h2>My Tasks</h2>
                <select id="taskFilter" aria-label="Filter tasks">
                    <option value="All">All Tasks</option>
                    <option value="Pending">Pending</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <div id="taskList" class="task-list">
                <p class="empty-message">No tasks yet. Add your first task!</p>
            </div>
        </section>
    </main>

    <footer>
        <p>Student Task & Deadline Tracker</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
